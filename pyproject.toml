[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ssm-latent-jax"
version = "0.1.0"
description = "Mamba-3 (selective SSM) x JEPA latent world models in JAX/Flax for research, verification and prototyping"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "Yoshihiro Ando", email = "90667654+yosh95@users.noreply.github.com" }]
keywords = [
    "jax", "flax", "mamba", "jepa", "ssm", "state-space-model", "world-model",
    "latent-prediction", "sigreg", "lejepa", "meta-learning", "reptile", "sai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jax>=0.6.0",
    "flax>=0.11.0",   # `nnx.List` (required for the layer stacks) appeared in 0.11
    "optax>=0.2.0",
    "numpy>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]
cuda = ["jax[cuda12]>=0.6.0"]

[project.urls]
Homepage = "https://github.com/yosh95/ssm-latent-jax"
Repository = "https://github.com/yosh95/ssm-latent-jax"
Rust = "https://github.com/yosh95/ssm-latent-rs"
PyTorch = "https://github.com/yosh95/ssm-latent-py"

[tool.hatch.build.targets.wheel]
packages = ["src/ssm_latent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
markers = [
    "slow: tests that take more than a couple of seconds",
]

[tool.coverage.run]
source = ["ssm_latent"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # flake8-bugbear
    "UP",            # pyupgrade
    "RUF",           # ruff-specific
    "SIM",           # flake8-simplify
    "NPY",           # numpy-specific
]
ignore = [
    "E501",   # long lines are allowed up to `line-length`
    "B008",   # `LossWeights()` as a default argument is intentional (immutable-ish)
    "RUF022", # hand-ordered `__all__`
    "SIM108", # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF059"]  # tuple unpacking in tests is often intentionally partial
"examples/*" = ["F401", "E402"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
